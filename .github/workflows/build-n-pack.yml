name: Android CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - stable
  push:
    branches:
      - stable

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build debug APK
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify and assemble
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug compileDebugAndroidTestKotlin detekt ktlintCheck -PbuildNumber="$BUILD_NUMBER"

      - name: Resolve artifact metadata
        if: github.ref == 'refs/heads/stable' && github.event_name != 'pull_request'
        id: artifact_metadata
        run: |
          version_name="$(./gradlew -q :app:printVersionName)"
          echo "name=jetpack-compose-custom-drawing-samples-${version_name}-build-${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload versioned debug APK
        if: github.ref == 'refs/heads/stable' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_metadata.outputs.name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
